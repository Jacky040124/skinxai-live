name: EczemaTwin
options:
  bundleIdPrefix: com.jackyzhong
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
packages:
  EczemaKit:
    path: Packages/EczemaKit
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 35AD3DPH6Y
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  EczemaTwin:
    type: application
    platform: iOS
    sources:
      - path: App/iOS
      - path: Shared
    dependencies:
      - package: EczemaKit
      - target: EczemaTwinWatch
        embed: true
        copy:
          destination: productsDirectory
          subpath: $(CONTENTS_FOLDER_PATH)/Watch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackyzhong.eczematwin2
        TARGETED_DEVICE_FAMILY: "1"
    entitlements:
      path: App/iOS/iOS.entitlements
      properties:
        com.apple.developer.healthkit: true
    info:
      path: App/iOS/Info.plist
      properties:
        CFBundleDisplayName: Eczema Twin
        CFBundleVersion: "9"
        UILaunchScreen: {}
        # Wins over UILaunchScreen: the app's first frame (App/iOS/Shell/LaunchScreen.storyboard).
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIAppFonts: [SpaceGrotesk.ttf, SpaceMono-Regular.ttf, SpaceMono-Bold.ttf]
        NSHealthShareUsageDescription: Eczema Twin reads your sleep and heart data to understand your flares.
        NSHealthUpdateUsageDescription: Eczema Twin saves nothing to Health.
        NSLocationWhenInUseUsageDescription: Eczema Twin uses your location for local humidity, air quality and pollen.
        NSCameraUsageDescription: Take a photo of a product label so Claude can read the ingredients.
  EczemaTwinWatch:
    type: application
    platform: watchOS
    sources:
      - path: App/Watch
      - path: Shared
    dependencies:
      - package: EczemaKit
    configFiles:
      Debug: App/Watch/Live.xcconfig
      Release: App/Watch/Live.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackyzhong.eczematwin2.watchkitapp
        SKIP_INSTALL: YES
    entitlements:
      path: App/Watch/Watch.entitlements
      properties:
        com.apple.developer.healthkit: true
    info:
      path: App/Watch/Info.plist
      properties:
        CFBundleDisplayName: Eczema Twin
        CFBundleVersion: "9"
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.jackyzhong.eczematwin2
        WKBackgroundModes: [workout-processing, physical-therapy]
        TwinLiveHost: $(TWIN_LIVE_HOST)
        TwinLiveKey: $(TWIN_LIVE_KEY)
        UIAppFonts: [SpaceGrotesk.ttf, SpaceMono-Regular.ttf, SpaceMono-Bold.ttf]
        NSMotionUsageDescription: Eczema Twin reads wrist motion to detect scratching.
        NSHealthShareUsageDescription: Eczema Twin keeps a workout session so it can detect scratching in the background.
        NSHealthUpdateUsageDescription: Eczema Twin keeps a workout session so it can detect scratching in the background.
